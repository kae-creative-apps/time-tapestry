<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Time Tapestry brand closer</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Quicksand"; src: url("assets/quicksand-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fbfaf8;
      }
      #brand-closer {
        width: 100%;
        height: 100%;
        color: #432e23;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 34px;
      }
      #brand-logo {
        display: block;
        width: 760px;
        height: auto;
      }
      #brand-tagline {
        font-family: "Quicksand", sans-serif;
        font-weight: 500;
        font-size: 36px;
        color: #756454;
      }
    </style>
  </head>
  <body>
    <!-- Asset exported from src/lib/brand-art.ts by scripts/export-brand.ts. -->
    <div
      id="brand-closer"
      data-composition-id="brand-closer"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-content">
        <img
          id="brand-logo"
          class="clip"
          src="assets/time-tapestry-lockup.svg"
          alt="Time Tapestry"
          data-start="0"
          data-duration="4"
          data-track-index="1"
        />
        <p
          id="brand-tagline"
          class="clip"
          data-start="0"
          data-duration="4"
          data-track-index="2"
        >
          Stories woven together
        </p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      timeline.from(
        "#brand-logo",
        { opacity: 0, y: 18, duration: 0.73, ease: "power2.out" },
        0,
      );
      timeline.from(
        "#brand-tagline",
        { opacity: 0, duration: 0.73, ease: "power2.out" },
        0.53,
      );
      window.__timelines["brand-closer"] = timeline;
    </script>
  </body>
</html>
