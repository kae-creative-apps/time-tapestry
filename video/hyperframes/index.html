<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Time Tapestry temporary wordmark closer</title>
<script src="assets/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #faf6ef; }
#brand-closer { width: 100%; height: 100%; color: #1a1714; }
.scene-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 120px 160px; gap: 34px; }
#wordmark { font-family: Georgia, serif; font-size: 104px; font-weight: 400; }
#brand-line { width: 230px; height: 4px; background: #7a2e2e; }
</style>
</head>
<body>
<!-- Text wordmark is a placeholder until the final logo is approved. -->
<div id="brand-closer" data-composition-id="brand-closer" data-start="0" data-duration="4" data-width="1920" data-height="1080">
<div class="scene-content">
<h1 id="wordmark" class="clip" data-start="0" data-duration="4" data-track-index="1">time tapestry</h1>
<div id="brand-line" class="clip" data-start="0" data-duration="4" data-track-index="2" aria-hidden="true"></div>
</div>
</div>
<script>
window.__timelines = window.__timelines || {};
const timeline = gsap.timeline({ paused: true });
timeline.from('#wordmark', { opacity: 0, y: 18, duration: 0.73, ease: 'power2.out' }, 0);
timeline.from('#brand-line', { scaleX: 0, duration: 0.73, ease: 'power2.out' }, 0.53);
window.__timelines['brand-closer'] = timeline;
</script>
</body>
</html>
